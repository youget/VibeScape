<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: Deep Space Black with rounded corners -->
  <rect width="100" height="100" rx="22" fill="#0a0a0f"/>
  
  <!-- Glow Effect (Subtle) -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main "V" Shape: Gradient Purple to Cyan -->
  <path d="M30 35 L50 65 L70 35" 
        stroke="url(#grad1)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
        filter="url(#glow)"/>
        
  <!-- AI Sparkles (Representing Creativity) -->
  <circle cx="50" cy="25" r="3" fill="#22d3ee"/>
  <circle cx="75" cy="30" r="2" fill="#7c3aed"/>
  <circle cx="25" cy="30" r="2" fill="#7c3aed"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
